[project]
name = "conciliacao"
version = "0.1.0"
description = "Conciliação do crédito tributário: razão CT2010 contra o CT do Sinqia."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas",
    "openpyxl",
    "SQLAlchemy",
    "python-dotenv",
    "PyYAML",
    "oracledb",
    "pyodbc",
]

[project.scripts]
conciliacao = "conciliacao.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
